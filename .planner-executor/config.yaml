# .planner-executor/config.yaml
# Generated by scripts/init.sh — edit freely after generation.
#
# plan-executor.sh reads this file when running tests.
# All values are optional: if a key is absent, the script will prompt you.

# ── Project identity ──────────────────────────────────────────────────────────

project_name: "RasberryPi_Project"
project_type: "python+c"    # robot_voice/ = Python, AppBookingResPi4/ = C/Make

# ── Commands ──────────────────────────────────────────────────────────────────
# Use shell syntax. Multiline: use && to chain steps.
# Leave a value empty ("") if the command does not apply.

# Python subsystem (robot_voice/)
build_cmd: "cd robot_voice && python -m compileall -q src tests"
test_cmd:  "cd robot_voice && pytest -q"
lint_cmd:  ""
run_cmd:   "cd robot_voice && ROBOT_DRY_RUN=1 ROBOT_WORKFLOW=text_hybrid python -m src.main"

# C subsystem (AppBookingResPi4/) — override per-plan when working on C code:
#   build_cmd: "cd AppBookingResPi4 && make"
#   test_cmd:  "cd AppBookingResPi4 && make test 2>/dev/null || echo 'no test target'"
#   run_cmd:   "cd AppBookingResPi4 && ./appbooking -p 8080"

# ── Plan settings ─────────────────────────────────────────────────────────────

plans_dir: ".plans"               # where plan folders live — rarely needs changing
executor:  "copilot"              # copilot | cursor | api  (Phase 3+)
max_retries: 0                    # auto-retry on test failure via API (Phase 5+)

# ── Environment setup (optional) ─────────────────────────────────────────────
# Source robot_voice/.env before running Python commands.
# Uncomment if needed: env_setup: "set -a && source robot_voice/.env && set +a"

env_setup: ""
